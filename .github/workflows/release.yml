name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.sha }}

  version:
    name: Calculate version and tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Commit version and push tag atomically
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/auto-version.ts

  publish:
    name: Build and publish assets
    needs: [checks, version]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.version.outputs.created == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-${{ needs.version.outputs.tag || inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Validate release version and source
        run: |
          npm run check:version -- --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm run release
      - name: Verify archive and prepare GitHub assets
        run: node dist/scripts/prepare-github-release.js "$RELEASE_TAG"
      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node dist/scripts/publish-github-release.js "$RELEASE_TAG"
